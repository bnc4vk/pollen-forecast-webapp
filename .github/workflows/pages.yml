name: Deploy to GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var DEPLOY_SHA:${{ github.sha }}

      - name: Verify Worker deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          response="$(curl --fail --retry 6 --retry-delay 5 --silent --show-error \
            "https://pollen-forecast-api.bnc4vk-pollen.workers.dev/api/health?sha=${EXPECTED_SHA}")"
          echo "$response" | jq --exit-status --arg sha "$EXPECTED_SHA" \
            '.ok == true and .deploySha == $sha'

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write deployment metadata
        run: printf '{"sha":"%s"}\n' "$GITHUB_SHA" > public/deploy.json

      - name: Build static app
        run: npm run build
        env:
          VITE_BASE_PATH: /pollen-forecast-webapp/
          VITE_API_BASE_URL: https://pollen-forecast-api.bnc4vk-pollen.workers.dev

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [deploy-api, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Pages deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          response="$(curl --fail --retry 12 --retry-delay 10 --silent --show-error \
            "https://bnc4vk.github.io/pollen-forecast-webapp/deploy.json?sha=${EXPECTED_SHA}")"
          echo "$response" | jq --exit-status --arg sha "$EXPECTED_SHA" '.sha == $sha'
